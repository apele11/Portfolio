<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/EA-Icon.png" />
    <!-- viewport-fit=cover extends the layout viewport to the physical screen
         edges. The default (auto) confines the page to the safe area and fills
         what is left with the page backdrop, which is what reads as grey bars
         framing the site on iPhone. It is also what makes env(safe-area-inset-*)
         return anything other than 0, so the gutter rule in index.css depends
         on this tag being here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The playground embeds are served from this origin. Opening the DNS/TCP/TLS
         connection up front takes that handshake off the critical path whether the
         user lands on /playground directly or navigates there later. -->
    <link rel="preconnect" href="https://apele11.github.io" />
    <link rel="dns-prefetch" href="https://apele11.github.io" />

    <title>Emily Apel — Experience Designer &amp; Creative Technologist</title>
    <meta
      name="description"
      content="Immersive web experiences by Emily Apel — WebGL, React, and design systems. Case studies in product design, front-end engineering, and creative technology."
    />
    <meta name="author" content="Emily Apel" />
    <link rel="canonical" href="https://emilyapel.com/" />
    <!-- Paints the mobile browser chrome, so the bars continue the page instead
         of framing it in grey. Matches uColor1, the darkest stop of the hero
         shader, and the html background in index.css — all three have to move
         together or the seams show.

         This is a flat colour and has to stay one. Two alternatives were tried
         on an iPhone and neither works:
           - Removing the tag, to let Safari sample the page. It reads the html
             background rather than the canvas, so the bars come out one flat
             colour anyway.
           - Rewriting content from the live shader palette on every change.
             The meta element does update, but Safari reads theme-color at load
             and ignores later mutations, so the bars never repaint.
         The chrome cannot show the gradient. Only a standalone (Add to Home
         Screen) display mode removes the bars entirely. -->
    <meta name="theme-color" content="#19053d" />

    <!-- Open Graph / Twitter. Every URL here is absolute on purpose: link
         scrapers fetch the tags out of context and do not resolve relative
         paths against the page they came from, so a bare "/og-image.jpg" is
         the single most common way a preview silently comes back blank. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Emily Apel" />
    <meta property="og:url" content="https://emilyapel.com/" />
    <meta property="og:title" content="Emily Apel — Experience Designer &amp; Creative Technologist" />
    <meta
      property="og:description"
      content="Immersive web experiences by Emily Apel — WebGL, React, and design systems. Case studies in product design, front-end engineering, and creative technology."
    />
    <meta property="og:image" content="https://emilyapel.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The name Emily Apel over the indigo and teal gradient the site's hero shader draws, above the line Immersive Experience Designer and Creative Technologist."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emily Apel — Experience Designer &amp; Creative Technologist" />
    <meta
      name="twitter:description"
      content="Immersive web experiences by Emily Apel — WebGL, React, and design systems. Case studies in product design, front-end engineering, and creative technology."
    />
    <meta name="twitter:image" content="https://emilyapel.com/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="The name Emily Apel over the indigo and teal gradient the site's hero shader draws, above the line Immersive Experience Designer and Creative Technologist."
    />

    <!-- Lets a search for the name resolve to a person with links, rather than
         to an untitled page. Nothing renders this; it is for the crawler. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Emily Apel",
        "url": "https://emilyapel.com/",
        "image": "https://emilyapel.com/og-image.jpg",
        "jobTitle": "Experience Designer & Creative Technologist",
        "email": "mailto:emilyapel@ufl.edu",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Florida"
        },
        "knowsAbout": [
          "Front-end engineering",
          "Design systems",
          "WebGL",
          "React",
          "Interaction design",
          "Creative technology"
        ],
        "sameAs": [
          "https://github.com/apele11",
          "https://www.linkedin.com/in/emily-apel-900128293/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
